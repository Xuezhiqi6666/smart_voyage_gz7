
# version: '3.5'
# Windows/x86_64 Version
# Redis Password set to: 1234
services:
    etcd:
        container_name: milvus-etcd
        image: quay.io/coreos/etcd:v3.5.5
        environment:
            - ETCD_AUTO_COMPACTION_MODE=revision
            - ETCD_AUTO_COMPACTION_RETENTION=1000
            - ETCD_QUOTA_BACKEND_BYTES=4294967296
            - ETCD_ENABLE_V2=true
        volumes:
            - ./volumes/etcd:/etcd/data
        command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd/data
    minio:
        container_name: milvus-minio
        image: minio/minio:RELEASE.2023-03-20T20-16-18Z
        environment:
            MINIO_ACCESS_KEY: minioadmin
            MINIO_SECRET_KEY: minioadmin
        volumes:
            - ./volumes/minio:/minio/data
        command: minio server /minio/data
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 30s
            timeout: 20s
            retries: 3
    standalone:
        container_name: milvus-standalone
        # 使用多架构镜像，Docker on Windows 会自动拉取 x86_64 版本
        image: milvusdb/milvus:v2.4.4
        command: ["milvus", "run", "standalone"]
        environment:
            - ETCD_ENDPOINTS=etcd:2379
            - MINIO_ADDRESS=minio:9000
        volumes:
            - ./volumes/milvus:/var/lib/milvus
        ports:
            - "19530:19530"
            - "9091:9091"
        depends_on:
            - "etcd"
            - "minio"
    redis:
        container_name: milvus-redis
        image: redis:latest
        restart: always
        ports:
            - "6379:6379"
        volumes:
            - ./volumes/redis:/data
        # 设置 Redis 密码为 1234
        command: redis-server --requirepass 1234

    # ==================== MySQL ====================
    mysql:
        container_name: mysql
        image: mysql:8.0
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: "123456"
            # 自动创建业务用户，替代 ensure_mysql_user() 的手动逻辑
            MYSQL_USER: smart_voyage
            MYSQL_PASSWORD: "123456"
            MYSQL_DATABASE: travel_rag
            # 时区：通过环境变量传入，镜像内置支持
            TZ: Asia/Shanghai
        ports:
            # 宿主机 3307 映射容器 3306，避免与本地已有 MySQL 端口冲突
            - "3307:3306"
        volumes:
            - ./volumes/mysql/data:/var/lib/mysql
            - ./volumes/mysql/conf:/etc/mysql/conf.d
            - ./volumes/mysql/init:/docker-entrypoint-initdb.d
        command:
            # 字符集通过 command 设置，这是唯一生效的方式
            - --default-authentication-plugin=mysql_native_password
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --lower-case-table-names=1

        healthcheck:
            # 通过 MYSQL_PWD 环境变量传递密码，避免暴露在 ps/日志中
            test: ["CMD-SHELL", "MYSQL_PWD=123456 mysqladmin ping -h localhost -u root"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
networks:
    default:
        name: milvus-network
